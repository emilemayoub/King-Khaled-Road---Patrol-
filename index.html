
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>KKR Patrol Checkpoint</title>

<style>

* {box-sizing:border-box}

body {

margin:0;

background:#cfe0f4;

color:#cfe0f4;

font-family:Arial,sans-serif;

text-align:center;

padding:24px 12px;

}

.card {

background:#22242a;

border-radius:26px;

padding:32px 18px;

max-width:520px;

margin:20px auto;

}

h1 {font-size:25px}

hr {border:0;border-top:1px solid #aaa}

.label {color:#aaa;margin-top:35px;font-size:17px}

.value {font-size:29px;font-weight:bold;margin:15px 0}

#clock {font-size:40px;color:#41d34c;font-weight:bold}

.note {font-size:15px;margin-top:25px}

</style>

</head>

<body>

<div class="card">

<h1>KKR PATROL CHECKPOINT</h1>

<hr>

<div class="label">LOCATION</div>

<div class="value" id="location"></div>

<div class="label">CHECKPOINT ID</div>

<div class="value" id="checkpoint"></div>

<div class="label">DATE</div>

<div class="value" id="date"></div>

<div class="label">SAUDI ARABIA TIME</div>

<div id="clock"></div>

<div class="note">

Take a screenshot and send to WhatsApp

</div>

</div>

<script>

// EDIT LOCATION NAMES HERE LATER

const locations = {

  "001": "Checkpoint 001",

  "002": "Checkpoint 002",

  "003": "Checkpoint 003",

  "004": "Checkpoint 004",

  "005": "Checkpoint 005",

  "006": "Checkpoint 006",

  "007": "Checkpoint 007",

  "008": "Checkpoint 008",

  "009": "Checkpoint 009",

  "010": "Checkpoint 010",

  "011": "Checkpoint 011",

  "012": "Checkpoint 012",

  "013": "Checkpoint 013",

  "014": "Checkpoint 014",
  
  "015": "Yamama Checkpoint 01",

  "016": "Yamama Checkpoint 02",

  "017": "Yamama Checkpoint 03",

  "018": "Yamama Checkpoint 04",

  "019": "Yamama Checkpoint 05",

  "020": "Yamama Checkpoint 06",

  "021": "Yamama Checkpoint 07",

  "022": "Yamama Checkpoint 07",

  "023": "Yamama Checkpoint 08",

  "024": "Yamama Checkpoint 09",

  "025": "Yamama Checkpoint 010",

  "026": "Yamama Checkpoint 011",

  "027": "Yamama Checkpoint 012",

  "028": "Yamama Checkpoint 013",

  "029": "Yamama Checkpoint 014",

  "030": "Yamama Checkpoint 015",

  "031": "Yamama Checkpoint 016",

  "032": "Yamama Checkpoint 017",

  "033": "Yamama Checkpoint 018",

  "034": "Uyuny Checkpoint 01",

  "035": "Uyuny Checkpoint 02",

  "036": "Uyuny Checkpoint 03",

  "037": "Uyuny Checkpoint 04",

  "038": "Uyuny Checkpoint 05",

  "039": "Uyuny Checkpoint 06",

  "040": "Uyuny Checkpoint 07",

  "041": "Uyuny Checkpoint 08",

  "042": "Uyuny Checkpoint 09",

  "043": "Uyuny Checkpoint 010",

  "044": "Uyuny Checkpoint 011",

  "045": "Uyuny Checkpoint 012"
};

 

const params = new URLSearchParams(location.search);

const id = (params.get("cp") || "001").padStart(3,"0");

 

document.getElementById("checkpoint").textContent =

locations[id] ? id : "Invalid checkpoint";

 

document.getElementById("location").textContent =

locations[id] || "Not configured";

 

function updateClock() {

const now = new Date();

const options = {timeZone:"Asia/Riyadh"};

document.getElementById("date").textContent =

new Intl.DateTimeFormat("en-GB",{

...options,day:"2-digit",month:"long",year:"numeric"

}).format(now);

document.getElementById("clock").textContent =

new Intl.DateTimeFormat("en-US",{

...options,hour:"2-digit",minute:"2-digit",

second:"2-digit",hour12:true

}).format(now);

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>

</html>
